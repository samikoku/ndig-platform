name: Lighthouse CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Wait for Vercel Preview
        uses: actions/github-script@v7
        id: vercel-preview
        with:
          script: |
            const fs = require('fs');
            const maxAttempts = 30;
            const delayMs = 10000; // 10 seconds

            for (let i = 0; i < maxAttempts; i++) {
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const vercelComment = comments.data.find(c =>
                c.user.login === 'vercel[bot]' && c.body.includes('https://')
              );

              if (vercelComment) {
                const match = vercelComment.body.match(/https:\/\/[^\s]+/);
                if (match) {
                  console.log('Preview URL: ' + match[0]);
                  return match[0];
                }
              }

              if (i < maxAttempts - 1) {
                await new Promise(resolve => setTimeout(resolve, delayMs));
              }
            }

            throw new Error('Vercel preview URL not found');
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: './lighthouserc.json'
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LHCI_GITHUB_PR: true
          VERCEL_PREVIEW_URL: ${{ steps.vercel-preview.outputs.result }}
